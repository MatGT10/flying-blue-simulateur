<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f2f7" />
    <script>
      // Thème choisi (ou réglage du téléphone) appliqué avant le premier rendu : pas de flash blanc.
      try {
        var systeme = matchMedia("(prefers-color-scheme: dark)").matches ? "sombre" : "clair";
        var t = localStorage.getItem("fb-theme");
        // Le réglage du téléphone a le dernier mot : un choix manuel ne vaut que tant qu'il n'a pas changé.
        if ((t === "clair" || t === "sombre") && localStorage.getItem("fb-theme-systeme") !== systeme) {
          localStorage.removeItem("fb-theme");
          localStorage.removeItem("fb-theme-systeme");
          t = null;
        }
        if (t !== "clair" && t !== "sombre") t = systeme;
        document.documentElement.dataset.theme = t;
        if (t === "sombre") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#000000");
      } catch (e) {}
      // Application installée (ou ?appli=1) : pas de zoom possible, par le réglage de fenêtre et par le CSS.
      try {
        var appli = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true || /[?&]appli=1/.test(location.search);
        if (appli) {
          document.documentElement.classList.add("appli");
          document.querySelector('meta[name="viewport"]').setAttribute("content", "width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover");
        }
      } catch (e) {}
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Flying Blue" />
    <title>Simulateur de miles Flying Blue · Silver, Gold ou Platinum ?</title>
    <meta name="description" content="Saisissez vos dépenses mensuelles et découvrez combien de miles Flying Blue chaque carte AMEX vous rapporterait, leur valeur en euros et le gain net après cotisation." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Aperçus de lien (LinkedIn, Instagram, WhatsApp) : public/og-image.jpg (1200 × 630). -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="https://flying-blue-simulateur.vercel.app/" />
    <meta property="og:title" content="Simulateur de miles Flying Blue" />
    <meta property="og:description" content="Silver, Gold ou Platinum ? Calculez en 30 secondes ce que votre carte AMEX vous rapporterait vraiment." />
    <meta property="og:image" content="https://flying-blue-simulateur.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Simulateur de miles Flying Blue" />
    <meta name="twitter:description" content="Silver, Gold ou Platinum ? Calculez en 30 secondes ce que votre carte AMEX vous rapporterait vraiment." />
    <meta name="twitter:image" content="https://flying-blue-simulateur.vercel.app/og-image.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Garde-fou de démarrage. Si le code ne se charge pas (page figée en cache, fichier
      // introuvable) ou plante avant d'afficher quoi que ce soit, l'app se relance une fois
      // d'elle-même hors cache ; si ça ne suffit pas, le message d'erreur est affiché en clair.
      (function () {
        function recharger() {
          var u = new URL(location.href);
          u.searchParams.set("maj", String(Date.now()));
          location.replace(u.toString());
        }
        function montrer(message) {
          var d = document.getElementById("fb-erreur");
          if (!d) {
            d = document.createElement("div");
            d.id = "fb-erreur";
            d.style.cssText = "position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:9999;background:#ff3b30;color:#fff;font:14px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;padding:12px 14px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.3)";
            d.innerHTML = '<b>Problème au démarrage</b><br><span style="word-break:break-word"></span><br><button type="button" style="margin-top:10px;background:#fff;color:#ff3b30;border:0;border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px">Recharger</button>';
            d.querySelector("button").onclick = recharger;
            document.body.appendChild(d);
          }
          d.querySelector("span").textContent = message;
        }
        function relancerOuMontrer(message) {
          try {
            if (sessionStorage.getItem("fb-relance") !== "1") {
              sessionStorage.setItem("fb-relance", "1");
              recharger();
              return;
            }
          } catch (e) {}
          montrer(message);
        }
        window.addEventListener("error", function (e) {
          var cible = e.target;
          if (cible && cible.tagName === "SCRIPT" && cible.src && cible.src.indexOf("/assets/") !== -1) {
            relancerOuMontrer("Fichier introuvable : " + cible.src);
          } else if (e.message) {
            montrer(e.message + (e.filename ? " (" + e.filename.split("/").pop() + ":" + e.lineno + ")" : ""));
          }
        }, true);
        window.addEventListener("unhandledrejection", function (e) {
          var r = e.reason;
          montrer(String(r && r.message ? r.message : r));
        });
        setTimeout(function () {
          var root = document.getElementById("root");
          if (root && !root.firstChild) relancerOuMontrer("L’application n’a pas pu démarrer.");
        }, 4000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
